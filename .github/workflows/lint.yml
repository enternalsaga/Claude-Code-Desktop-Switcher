      - name: Harness core tests (PowerShell 7)
        shell: pwsh
        run: .\tests\HarnessCore.Tests.ps1

      - name: Harness bundle tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\HarnessBundle.Tests.ps1

      - name: Harness bundle tests (PowerShell 7)
        shell: pwsh
        run: .\tests\HarnessBundle.Tests.ps1

      - name: Harness Claude adapter tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\HarnessClaude.Tests.ps1

      - name: Harness Claude adapter tests (PowerShell 7)
        shell: pwsh
        run: .\tests\HarnessClaude.Tests.ps1

      - name: Harness Codex profile tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\HarnessCodexProfiles.Tests.ps1

      - name: Harness Codex profile tests (PowerShell 7)
