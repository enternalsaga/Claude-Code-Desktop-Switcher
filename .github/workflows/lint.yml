name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # A syntax error should be reported as a syntax error, not buried in lint output.
      - name: Parse check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok: $($_.Name)"
            }
          }
          if ($failed) { throw 'One or more scripts failed to parse.' }

      - name: Chat transfer regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\ChatTransfer.Tests.ps1

      - name: Chat transfer regression tests (PowerShell 7)
        shell: pwsh
        run: .\tests\ChatTransfer.Tests.ps1

      - name: Profile layout tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\ProfileLayout.Tests.ps1

      - name: Profile layout tests (PowerShell 7)
        shell: pwsh
        run: .\tests\ProfileLayout.Tests.ps1

      - name: Sign-in routing tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\SignInRouting.Tests.ps1

      - name: Sign-in routing tests (PowerShell 7)
        shell: pwsh
        run: .\tests\SignInRouting.Tests.ps1

      - name: Taskbar identity tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\TaskbarIdentity.Tests.ps1

      - name: Taskbar identity tests (PowerShell 7)
        shell: pwsh
        run: .\tests\TaskbarIdentity.Tests.ps1

      - name: Profile launch tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\ProfileLaunch.Tests.ps1

      - name: Profile launch tests (PowerShell 7)
        shell: pwsh
        run: .\tests\ProfileLaunch.Tests.ps1

      - name: Chat update tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\ChatUpdate.Tests.ps1

      - name: Chat update tests (PowerShell 7)
        shell: pwsh
        run: .\tests\ChatUpdate.Tests.ps1

      - name: Install update tests (Windows PowerShell 5.1)
